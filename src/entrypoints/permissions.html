<!DOCTYPE html>
<html>
  <head>
    <title>Grant Audio Permission</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f3f4f6;
        color: #1f2937;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
      }
      h1 { margin-bottom: 1rem; font-size: 1.5rem; }
      p { margin-bottom: 1.5rem; color: #4b5563; }
      button {
        background-color: #2563eb;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        border: none;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover { background-color: #1d4ed8; }
      .message { margin-top: 1rem; font-size: 0.9rem; }
      .success { color: #16a34a; }
      .error { color: #dc2626; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Audio Output Permission</h1>
      <p>Please grant permission to access audio devices. This is required to detect available speakers and headphones.</p>
      <button id="requestPermissionBtn">Grant Permission</button>
      <div id="statusMessage"></div>
    </div>
    <script type="module" src="../utils/permissions.ts"></script>
  </body>
</html>
